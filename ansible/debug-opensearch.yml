---
- name: Debug OpenSearch repo — show available packages
  hosts: elasticsearch
  become: true

  tasks:
    - name: Update apt cache fully
      apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Search for opensearch packages
      command: apt-cache search opensearch
      register: opensearch_packages

    - name: Show found packages
      debug:
        var: opensearch_packages.stdout_lines

